<pre><code><span class="kw">void</span> 对象的（不存在的）值不能够以任何方式使用，也不能被显式或隐式地转换为任一</code></pre>
<p>非空类型。因为空（void）表达式表示一个不存在的值，这样的表达式只可以用在不需要值的地方，例如作为一个表达式语句（参见 A.9.2 节）或作为逗号运算符的左操作数（参见 A.7.18节）</p>
<p>。</p>
<p>可以通过强制类型转换将表达式转换为 void 类型。例如，在表达式语句中，一个空的强制类型转换将丢掉函数调用的返回值。</p>
<p>说明：void 没有在本书的第 1 版中出现，但是在本书第 1 版出版后，它一直被广泛使用着。</p>    </div>
