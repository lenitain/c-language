<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.4.2 基本类型 - C语言教程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.9;
            color: #333;
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fafafa;
        }
        .section-header {
            border-left: 5px solid #00599A;
            padding-left: 18px;
            margin-bottom: 36px;
        }
        .section-number {
            font-size: 13px;
            color: #00599A;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .section-title {
            font-size: 30px;
            color: #1a1a1a;
            font-weight: 700;
            margin-top: 8px;
        }
        .content {
            font-size: 16px;
            background: white;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .content p {
            margin-bottom: 14px;
            color: #D3C6AA;
        }
        .content pre {
            background: #343F44;
            color: #D3C6AA;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 18px 0;
            font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #4F585E;
        }
        .content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .content .kw { color: #83C092; font-weight: 500; }
        .content .fn { color: #DBBC7F; }
        .content .str { color: #E69875; }
        .content .cm { color: #7A8478; font-style: italic; }
        .content h2 {
            font-size: 20px;
            color: #A7C080;
            margin: 28px 0 14px 0;
            border-bottom: 2px solid #4F585E;
            padding-bottom: 10px;
        }
        .content h3 {
            font-size: 17px;
            color: #D3C6AA;
            margin: 22px 0 10px 0;
        }
        ul, ol { margin: 12px 0 12px 24px; }
        li { margin-bottom: 8px; }
        .note {
            background: #2D353B;
            border-left: 4px solid #A7C080;
            padding: 14px 18px;
            margin: 18px 0;
            border-radius: 0 8px 8px 0;
        }
        body {
            background: #232A2E;
        }
        .content {
            background: #2D353B;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .section-header {
            border-left-color: #A7C080;
        }
        .section-number {
            color: #A7C080;
        }
        .section-title {
            color: #D3C6AA;
        }
    </style>
</head>
<body>
    <div class="section-header">
        <div class="section-number">第 A 章</div>
        <h1 class="section-title">A.4.2 基本类型</h1>
    </div>
    <div class="content">
<p></p>
    </div>
</body>
</html>
