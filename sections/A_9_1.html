    <div class="content">
<p>语句可带有标号前缀。</p>
<p>带标号语句：</p>
<p>标识符: 语句case 常量表达式: 语句default: 语句由标识符构成的标号声明了该标识符。标识符标号的惟一用途就是作为 goto 语句的跳转目标。标识符的作用域是当前函数。因为标号有自己的名字空间，因此不会与其它标识符混淆，并且不能被重新声明。详细信息参见 A.11.1 节。</p>
<p>case 标号和 default 标号用在 switch 语句中（参见 A.9.4 节）</p>
<p>。case 标号中的常量表达式必须为整型。</p>
<p>标号本身不会改变程序的控制流。</p>    </div>
