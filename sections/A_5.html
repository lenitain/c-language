    <div class="content">
<p>对象是一个命名的存储区域，左值（lvalue）是引用某个对象的表达式。具有合适类型与存储类的标识符便是左值表达式的一个明显的例子。某些运算符可以产生左值。例如，如果 E是一个指针类型的表达式，*E 则是一个左值表达式，它引用由 E 指向的对象。名字“左值”来源于赋值表达式 E1=E2，其中，左操作数 E1 必须是一个左值表达式。对每个运算符的讨论需要说明此运算符是否需要一个左值操作数以及它是否产生一个左值。</p>    </div>
